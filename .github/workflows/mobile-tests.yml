name: Mobile Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      spec:
        description: 'Run only these test files, comma-separated and in run order (e.g. tests/auth/mobile-login.spec.ts,tests/traveler/mobile-wishlist.spec.ts). Include the tests that create the accounts and data they use. Leave empty to run all.'
        required: false
        default: ''
  # Every day at 05:30 Vietnam time (GMT+7), which is 22:30 UTC the day before. GitHub schedules
  # use UTC, run on main, and can start late when GitHub is busy.
  schedule:
    - cron: '30 22 * * *'

# One run at a time: runs share the dev site's test accounts. A new push cancels the running one.
concurrency:
  group: mobile-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Signups, experience creation and the booking flow on an emulator take a long time.
    timeout-minutes: 180
    permissions:
      # Download the APK from the repo's releases, and push the report page to the gh-pages branch.
      contents: write
      # Check whether GitHub Pages is enabled before linking to the report page.
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The localite signup test verifies the new localite in the admin portal with Playwright.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run mobile:typecheck

      - name: Download the app (APK) from the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The APK is not in git: upload each new build as an asset of a GitHub Release
          # (Releases > Draft a new release). The newest release's .apk is used.
          mkdir -p testdata/apk
          gh release download --repo "${{ github.repository }}" --pattern '*.apk' --dir apk-download
          mv apk-download/*.apk testdata/apk/app-debug.apk
          ls -lh testdata/apk

      - name: Restore test credentials
        env:
          AUTH_CSV_BASE64: ${{ secrets.AUTH_CSV_BASE64 }}
        run: |
          if [ -z "$AUTH_CSV_BASE64" ]; then
            echo "Missing AUTH_CSV_BASE64 GitHub secret"
            exit 1
          fi
          # testdata/common only holds the git-ignored auth.csv, so the folder is not in the repo.
          mkdir -p testdata/common
          printf '%s' "$AUTH_CSV_BASE64" | base64 --decode > testdata/common/auth.csv

      # The Android emulator needs hardware acceleration (KVM) on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mobile tests on an Android emulator
        id: tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ADMIN_BASE_URL: https://dev.admin.imerzn.com
          RUN_SIGNUP_TEST: 'true'
          SPEC: ${{ github.event.inputs.spec }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # Each line runs in its own shell. The output is saved for the Slack summary below.
          # One test file at a time, in the order in mobile-wdio.conf.ts: later tests use the
          # accounts and bookings that earlier ones create.
          # The Pixel Launcher (home screen) is slow on the CI emulator and its "isn't responding"
          # dialog covers the app, so turn it off (the tests never use the home screen) and hide
          # system "not responding" dialogs.
          script: |
            adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher || true
            adb shell settings put global hide_error_dialogs 1 || true
            mkdir -p mobile-test-results
            bash -o pipefail -c 'if [ -n "$SPEC" ]; then ARGS=""; for f in $(echo "$SPEC" | tr "," " "); do ARGS="$ARGS --spec $f"; done; npx wdio run mobile-wdio.conf.ts $ARGS; else npm run mobile:test; fi 2>&1 | tee mobile-test-results/wdio-output.log'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          # Failure screenshots, element trees, Appium log and the test output.
          path: mobile-test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build report page
        id: report
        if: always()
        run: |
          LOG=mobile-test-results/wdio-output.log
          if [ -f "$LOG" ]; then
            # WebdriverIO's last line, e.g. "Spec Files: 17 passed, 2 failed, 19 total (100% completed) in 01:10:00".
            SUMMARY=$(grep -a 'Spec Files:' "$LOG" | tail -1 | sed 's/^[[:space:]]*//;s/[[:space:]]\+/ /g')
          else
            SUMMARY="Tests did not run (failed before the test step)."
          fi
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          # The repo is public, so the page is public: failed tests' errors (passwords masked),
          # screenshots and the masked log only.
          node scripts/failure-report.mjs mobile-test-results/failures.jsonl "$LOG" public-report "$SUMMARY"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          # Link to the page only if GitHub Pages is enabled (Settings > Pages, branch gh-pages);
          # otherwise Slack links to the run. The page is pushed to gh-pages either way.
          PAGES_STATUS=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$PAGES_STATUS" = "200" ]; then
            echo "url=https://$OWNER.github.io/$REPO/reports/${{ github.run_id }}/" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages is not enabled (HTTP $PAGES_STATUS); Slack will link to the run instead."
          fi

      - name: Publish report page to GitHub Pages
        id: pages
        if: always() && steps.report.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public-report
          # One folder per run, so each Slack link keeps pointing at its own report.
          destination_dir: reports/${{ github.run_id }}
          keep_files: true

      - name: Notify Slack
        # Runs after every job (pass or fail): the result, failed tests' names and the report link.
        # Needs the SLACK_BOT_TOKEN and SLACK_CHANNEL_ID (or SLACK_WEBHOOK_URL) repository secrets.
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          SUMMARY: ${{ steps.report.outputs.summary }}
          REPORT_URL: ${{ steps.pages.outcome == 'success' && steps.report.outputs.url || '' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          node scripts/slack-report.mjs --name "Mobile tests" --outcome "$TEST_OUTCOME" --summary "$SUMMARY" \
            --failures mobile-test-results/failures.jsonl --report-url "$REPORT_URL" \
            --run-url "$RUN_URL" --branch "$BRANCH" --actor "$ACTOR" \
            || echo "::warning::Slack notification failed (check the SLACK_* secrets)."
