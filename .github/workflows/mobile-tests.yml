name: Mobile Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      spec:
        description: 'Run one test file only (e.g. tests/auth/mobile-login.spec.ts). Leave empty to run all.'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    # Signups, experience creation and the booking flow on an emulator take a long time.
    timeout-minutes: 180
    permissions:
      # Download the APK from the repo's releases.
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The localite signup test verifies the new localite in the admin portal with Playwright.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Type check
        run: npm run mobile:typecheck

      - name: Download the app (APK) from the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The APK is not in git: upload each new build as an asset of a GitHub Release
          # (Releases > Draft a new release). The newest release's .apk is used.
          mkdir -p testdata/apk
          gh release download --repo "${{ github.repository }}" --pattern '*.apk' --dir apk-download
          mv apk-download/*.apk testdata/apk/app-debug.apk
          ls -lh testdata/apk

      - name: Restore test credentials
        env:
          AUTH_CSV_BASE64: ${{ secrets.AUTH_CSV_BASE64 }}
        run: |
          if [ -z "$AUTH_CSV_BASE64" ]; then
            echo "Missing AUTH_CSV_BASE64 GitHub secret"
            exit 1
          fi
          # testdata/common only holds the git-ignored auth.csv, so the folder is not in the repo.
          mkdir -p testdata/common
          printf '%s' "$AUTH_CSV_BASE64" | base64 --decode > testdata/common/auth.csv

      # The Android emulator needs hardware acceleration (KVM) on the Linux runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run mobile tests on an Android emulator
        id: tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ADMIN_BASE_URL: https://dev.admin.imerzn.com
          RUN_SIGNUP_TEST: 'true'
          SPEC: ${{ github.event.inputs.spec }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # Each line runs in its own shell. The output is saved for the Slack summary below.
          # One test file at a time, in the order in mobile-wdio.conf.ts: later tests use the
          # accounts and bookings that earlier ones create.
          script: |
            mkdir -p mobile-test-results
            bash -o pipefail -c 'if [ -n "$SPEC" ]; then npx wdio run mobile-wdio.conf.ts --spec "$SPEC"; else npm run mobile:test; fi 2>&1 | tee mobile-test-results/wdio-output.log'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results
          # Failure screenshots, element trees, Appium log and the test output.
          path: mobile-test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Notify Slack
        # Runs after every job (pass or fail). Needs the SLACK_WEBHOOK_URL repository secret
        # (a Slack "Incoming Webhook" URL).
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret is not set; skipping Slack notification."
            exit 0
          fi

          LOG=mobile-test-results/wdio-output.log
          if [ -f "$LOG" ]; then
            # WebdriverIO's last line, e.g. "Spec Files: 17 passed, 2 failed, 19 total (100% completed) in 01:10:00".
            SUMMARY=$(grep -a 'Spec Files:' "$LOG" | tail -1 | sed 's/^[[:space:]]*//')
            # Failed tests are listed by the spec reporter with a "✖" mark.
            FAILED_TESTS=$(grep -a '✖' "$LOG" | sed 's/^[[:space:]]*✖[[:space:]]*/• /' | sort -u | head -15)
          else
            SUMMARY="Tests did not run (failed before the test step)."; FAILED_TESTS=""
          fi

          if [ "$TEST_OUTCOME" = "success" ]; then
            ICON=":white_check_mark:"; RESULT="All tests passed"
          else
            ICON=":x:"; RESULT="Tests failed"
          fi

          TEXT="$ICON *Mobile tests — $RESULT* (branch \`$BRANCH\`, by $ACTOR)
          $SUMMARY"
          if [ -n "$FAILED_TESTS" ] && [ "$TEST_OUTCOME" != "success" ]; then
            TEXT="$TEXT
          *Failed tests:*
          $FAILED_TESTS"
          fi
          TEXT="$TEXT
          <$RUN_URL|View run and download the screenshots>"

          # Remove the YAML indentation from continuation lines, then send as JSON.
          TEXT=$(printf '%s' "$TEXT" | sed 's/^          //')
          jq -n --arg text "$TEXT" '{text: $text}' \
            | curl -sS -f -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed (check that SLACK_WEBHOOK_URL is a valid Incoming Webhook URL)."
